async function avviaImportazione() {
  const btn = document.getElementById('btnAvvia');
  btn.disabled = true;
  btn.textContent = '⏳ Caricamento...';
  document.getElementById('status').textContent = 'Lettura archivio esistente...';

  try {
    // Read existing schede
    const getResp = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const existing = await getResp.json();
    const schedeEsistenti = existing.record.schede || [];

    document.getElementById('status').textContent = `Archivio attuale: ${schedeEsistenti.length} schede. Aggiunta di 170 nuove...`;

    // Merge: keep existing + add new
    const tutteLeSchede = [...schedeEsistenti, ...nuoveSchede];

    // Save back
    const putResp = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY,
        'X-Bin-Versioning': 'false'
      },
      body: JSON.stringify({ schede: tutteLeSchede })
    });

    if (putResp.ok) {
      document.getElementById('status').textContent = '';
      document.getElementById('done-msg').style.display = 'block';
      btn.textContent = '✓ Completato';
    } else {
      throw new Error('Risposta non OK: ' + putResp.status);
    }
  } catch(e) {
    document.getElementById('err-msg').textContent = '✗ Errore: ' + e.message;
    document.getElementById('err-msg').style.display = 'block';
    document.getElementById('status').textContent = '';
    btn.disabled = false;
    btn.textContent = '▶ Riprova';
  }
}
