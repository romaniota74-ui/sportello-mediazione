async function avviaImportazione() {
  const btn = document.getElementById('btnAvvia');
  btn.disabled = true;
  btn.textContent = '⏳ Importazione in corso...';
  document.getElementById('progress-bar-wrap').style.display = 'block';
  document.getElementById('log').style.display = 'block';
  const log = document.getElementById('log');
  const bar = document.getElementById('progress-bar');
  const status = document.getElementById('status');
  let ok = 0, err = 0;

  for (let i = 0; i < records.length; i++) {
    const r = Object.assign({}, records[i]);
    const nome = [r.cognome, r.nome].filter(Boolean).join(' ') || 'Record ' + (i+1);
    status.textContent = 'Caricamento ' + (i+1) + ' / ' + records.length + ': ' + nome;
    bar.style.width = Math.round((i+1)/records.length*100) + '%';
    try {
      const resp = await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(r),
        headers: {'Content-Type': 'application/json'}
      });
      ok++;
      log.innerHTML += '<div class="ok">✓ ' + nome + '</div>';
    } catch(e) {
      err++;
      log.innerHTML += '<div class="err">✗ ' + nome + ': ' + e.message + '</div>';
    }
    log.scrollTop = log.scrollHeight;
    await new Promise(res => setTimeout(res, 300));
  }

  bar.style.width = '100%';
  status.textContent = 'Completato: ' + ok + ' inviati, ' + err + ' errori.';
  btn.textContent = '✓ Completato';
  document.getElementById('done-msg').style.display = 'block';
}
